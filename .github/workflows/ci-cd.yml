name: CI/CD Pipeline & DevSecOps Workflow

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  build-and-test:
    name: Build, Test & Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: 3. Make Maven Wrapper Executable
        run: chmod +x mvnw

      - name: 4. Execute Maven Unit & Regression Tests
        run: ./mvnw clean test

      - name: 5. Archive Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-test-reports
          path: '**/target/surefire-reports/*.xml'
          retention-days: 7

      - name: 6. Package Executable JAR
        run: ./mvnw package -DskipTests

      - name: 7. Archive Application JAR
        uses: actions/upload-artifact@v4
        with:
          name: spring-petclinic-artifact
          path: target/*.jar
          retention-days: 7

      - name: 8. Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 9. Build Multi-Stage Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: |
            clinic-management:latest
            clinic-management:${{ github.sha }}

      - name: 10. DevSecOps: Trivy Container Vulnerability Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'clinic-management:latest'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: false
          vuln-type: 'os,library'
          severity: 'HIGH,CRITICAL'

      - name: 11. Publish Job Summary
        if: always()
        run: |
          echo "### 🚀 CI/CD Pipeline Execution Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Repository:** [sushanth-arun/devops_mini_project](https://github.com/sushanth-arun/devops_mini_project)" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit SHA:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Java Version:** OpenJDK 17 (Eclipse Temurin)" >> $GITHUB_STEP_SUMMARY
          echo "- **Maven Build & Tests:** Completed Successfully ✅" >> $GITHUB_STEP_SUMMARY
          echo "- **Docker Image:** \`clinic-management:latest\` (Multi-Stage Alpine JRE 17) ✅" >> $GITHUB_STEP_SUMMARY
          echo "- **DevSecOps Audit:** Trivy High/Critical Scan Completed in Warn Mode ✅" >> $GITHUB_STEP_SUMMARY
