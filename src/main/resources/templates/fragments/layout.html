<!DOCTYPE html>

<html th:fragment="layout (template, menu)" xmlns:th="https://www.thymeleaf.org">

<head>

  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="shortcut icon" type="image/x-icon" th:href="@{/resources/images/favicon.png}">
  <title th:text="#{layoutTitle}">MediVet Cloud :: Automated Healthcare Management Platform</title>
  <link th:href="@{/webjars/font-awesome/css/font-awesome.min.css}" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/resources/css/petclinic.css}" />

</head>

<body>

  <nav class="navbar navbar-expand-lg navbar-dark shadow-sm" role="navigation" style="background: #1e293b;">
    <div class="container-fluid px-4">
      <a class="navbar-brand d-flex align-items-center text-white text-decoration-none fw-bold me-4" th:href="@{/}">
        <i class="fa fa-heartbeat text-info me-2 fs-4"></i>
        <span>MediVet <span class="badge bg-primary text-white rounded-pill ms-1" style="font-size: 11px;">CLOUD</span></span>
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#main-navbar">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="main-navbar">

        <ul class="navbar-nav me-auto mb-2 mb-lg-0" th:remove="all">

          <li th:fragment="menuItem (link,active,title,glyph,text)" th:class="nav-item">
            <a th:class="${active==menu ? 'nav-link active' : 'nav-link'}" th:href="@{__${link}__}" th:title="${title}">
              <span th:class="'fa fa-'+${glyph}" class="fa fa-home"></span>
              <span th:text="${text}">Template</span>
            </a>
          </li>

        </ul>

        <ul class="nav navbar-nav me-auto">

          <li th:replace="~{::menuItem ('/','home','home page','home',#{home})}">
            <span class="fa fa-home" aria-hidden="true"></span>
            <span th:text="#{home}">Home</span>
          </li>

          <li th:replace="~{::menuItem ('/owners/find','owners','find owners','search',#{findOwners})}">
            <span class="fa fa-search" aria-hidden="true"></span>
            <span th:text="#{findOwners}">Find owners</span>
          </li>

          <li th:replace="~{::menuItem ('/vets.html','vets','veterinarians','user-md',#{vets})}">
            <span class="fa fa-user-md" aria-hidden="true"></span>
            <span th:text="#{vets}">Veterinarians</span>
          </li>

          <li
            th:replace="~{::menuItem ('/oups','error','trigger a RuntimeException to see how it is handled','exclamation-triangle',#{error})}">
            <span class="fa exclamation-triangle" aria-hidden="true"></span>
            <span th:text="#{error}">Error</span>
          </li>

        </ul>

        <div class="d-flex align-items-center ms-auto">
          <span class="badge bg-success bg-gradient text-white px-3 py-2 rounded-pill shadow-sm" style="font-size: 0.8rem; letter-spacing: 0.3px;">
            <i class="fa fa-circle text-white me-1" style="font-size: 8px;"></i> Docker: Healthy | Ansible: Synced
          </span>
        </div>

      </div>
    </div>
  </nav>

  <div class="container-fluid py-4" style="background-color: #f8fafc; min-height: 85vh;">
    <div class="container xd-container">

      <th:block th:insert="${template}" />

      <footer class="mt-5 pt-4 pb-3 border-top text-center text-muted small">
        <div class="row align-items-center">
          <div class="col-md-6 text-md-start mb-2 mb-md-0">
            <strong>MediVet Cloud Healthcare Platform</strong> &bull; CI/CD Automated with Jenkins, Docker &amp; Ansible
          </div>
          <div class="col-md-6 text-md-end">
            <span class="badge bg-secondary">v4.1.0-prod</span>
            <span class="badge bg-dark ms-1">Alpine JRE 17</span>
            <span class="badge bg-info text-dark ms-1">Trivy Audited</span>
          </div>
        </div>
      </footer>

    </div>
  </div>

  <script th:src="@{/webjars/bootstrap/dist/js/bootstrap.bundle.min.js}"></script>

</body>

</html>
