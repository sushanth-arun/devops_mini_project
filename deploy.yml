---
# ==============================================================================
# Ansible Playbook: Automated Deployment for Healthcare Clinic Management System
# Course: Anna University (5th Sem) - DevOps Mini-Project Review
# College: PSG Institute of Technology and Applied Research (PSG iTech)
# ==============================================================================
- name: Deploy Healthcare Clinic Management System Container
  hosts: clinic_servers
  gather_facts: false

  vars:
    app_name: "clinic-app"
    image_name: "clinic-management:latest"
    host_port: 8080
    container_port: 8080
    healthcheck_url: "http://localhost:8080"
    healthcheck_retries: 30
    healthcheck_delay: 2

  tasks:
    - name: "1. Detect if existing clinic container is present"
      ansible.builtin.command: docker ps -a -q -f name=^/{{ app_name }}$
      register: existing_container
      changed_when: false
      failed_when: false

    - name: "2. Stop and remove existing container for idempotent deployment"
      ansible.builtin.command: docker rm -f {{ app_name }}
      when: existing_container.stdout != ""
      changed_when: true
      ignore_errors: true

    - name: "3. Run fresh Healthcare Clinic container"
      ansible.builtin.command: >
        docker run -d
        --name {{ app_name }}
        --restart unless-stopped
        -p {{ host_port }}:{{ container_port }}
        {{ image_name }}
      register: container_run
      changed_when: container_run.rc == 0

    - name: "4. Verify HTTP Health Check on {{ healthcheck_url }}"
      ansible.builtin.uri:
        url: "{{ healthcheck_url }}"
        method: GET
        status_code: [200, 302]
        return_content: false
        timeout: 5
      register: health_result
      until: health_result.status is defined and (health_result.status == 200 or health_result.status == 302)
      retries: "{{ healthcheck_retries }}"
      delay: "{{ healthcheck_delay }}"

    - name: "5. Display Deployment Verification Summary"
      ansible.builtin.debug:
        msg:
          - "=========================================================="
          - " HEALTHCARE CLINIC SYSTEM DEPLOYMENT SUCCESSFUL           "
          - " Container Name : {{ app_name }}"
          - " Docker Image   : {{ image_name }}"
          - " Published Port : {{ host_port }} -> {{ container_port }}"
          - " Health Endpoint: {{ healthcheck_url }} (HTTP {{ health_result.status }})"
          - " Status         : UP & HEALTHY"
          - "=========================================================="
